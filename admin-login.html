<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login — Backoffice Admin Kalurahan Bokoharjo</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=General+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<script>
  tailwind.config = {
    theme: { extend: { colors: {
      primary: {50:'#f0fdf4',100:'#dcfce7',200:'#bbf7d0',300:'#86efac',400:'#4ade80',500:'#22c55e',600:'#16a34a',700:'#15803d',800:'#166534',900:'#14532d',950:'#052e16'},
      earth: {50:'#faf8f5',100:'#f3efe8',200:'#e8e0d4',300:'#d4c7b4',400:'#b8a489',500:'#9a8367',600:'#7d6850',700:'#655341',800:'#544639',900:'#493d33'},
      accent:'#e8a838', dark:'#1a2e1a'
    }, fontFamily: { display:['"DM Serif Display"','serif'], body:['"General Sans"','sans-serif'] }}}
  }
</script>
<style>
  * { font-family: 'General Sans', system-ui, sans-serif; }
  .font-display { font-family: 'DM Serif Display', serif; }

  /* Subtle grid overlay */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image:
      linear-gradient(rgba(255,255,255,0.03) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,0.03) 1px, transparent 1px);
    background-size: 48px 48px;
    pointer-events: none;
    z-index: 0;
  }

  /* Floating orbs */
  .orb {
    position: fixed;
    border-radius: 50%;
    filter: blur(80px);
    opacity: 0.15;
    pointer-events: none;
  }

  .login-card {
    background: rgba(255, 255, 255, 0.97);
    backdrop-filter: blur(20px);
    border: 1px solid rgba(255,255,255,0.3);
  }

  @keyframes shake {
    0%, 100% { transform: translateX(0); }
    10%, 30%, 50%, 70%, 90% { transform: translateX(-6px); }
    20%, 40%, 60%, 80% { transform: translateX(6px); }
  }
  .shake { animation: shake 0.5s ease-in-out; }

  @keyframes fadeInUp {
    from { opacity: 0; transform: translateY(24px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .fade-in-up { animation: fadeInUp 0.6s ease-out forwards; }

  input:focus { outline: none; }

  .input-field {
    transition: border-color 0.2s, box-shadow 0.2s;
  }
  .input-field:focus {
    border-color: #16a34a;
    box-shadow: 0 0 0 3px rgba(22,163,74,0.12);
  }

  .btn-login {
    background: linear-gradient(135deg, #16a34a 0%, #15803d 100%);
    transition: all 0.2s;
    position: relative;
    overflow: hidden;
  }
  .btn-login::before {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(135deg, #15803d 0%, #14532d 100%);
    opacity: 0;
    transition: opacity 0.2s;
  }
  .btn-login:hover::before { opacity: 1; }
  .btn-login:active { transform: scale(0.98); }
  .btn-login span { position: relative; z-index: 1; }
</style>
</head>
<body class="min-h-screen flex items-center justify-center px-4 py-12"
      style="background:linear-gradient(160deg, #052e16 0%, #0d3320 40%, #14532d 100%);">

  <!-- Background orbs -->
  <div class="orb w-96 h-96 bg-green-400" style="top:-10%;left:-5%;"></div>
  <div class="orb w-80 h-80" style="bottom:5%;right:-5%;background:#e8a838;"></div>
  <div class="orb w-64 h-64 bg-green-300" style="bottom:20%;left:10%;"></div>

  <!-- Login card -->
  <div class="login-card relative z-10 w-full max-w-sm rounded-2xl shadow-2xl p-8 fade-in-up" id="loginCard">

    <!-- Header: Logo + Judul -->
    <div class="flex flex-col items-center mb-8">
      <img src="assets/logo.jpg" class="w-16 h-16 rounded-2xl object-cover mx-auto mb-3 ring-2 ring-[#e8a838]/50" alt="Logo Kalurahan Bokoharjo">
      <h1 class="font-display text-2xl text-primary-900 leading-tight text-center">Kalurahan Bokoharjo</h1>
      <div class="flex items-center gap-2 mt-1">
        <div class="h-px w-8 bg-[#e8a838] opacity-60"></div>
        <span class="text-xs font-semibold tracking-widest text-earth-500 uppercase">Admin Backoffice</span>
        <div class="h-px w-8 bg-[#e8a838] opacity-60"></div>
      </div>
    </div>

    <!-- Error message -->
    <div id="errorMsg"
         class="hidden mb-4 px-4 py-3 rounded-xl bg-red-50 border border-red-200 flex items-center gap-3">
      <svg class="w-5 h-5 text-red-500 shrink-0" fill="currentColor" viewBox="0 0 20 20">
        <path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zM8.707 7.293a1 1 0 00-1.414 1.414L8.586 10l-1.293 1.293a1 1 0 101.414 1.414L10 11.414l1.293 1.293a1 1 0 001.414-1.414L11.414 10l1.293-1.293a1 1 0 00-1.414-1.414L10 8.586 8.707 7.293z" clip-rule="evenodd"/>
      </svg>
      <p class="text-sm text-red-700 font-medium">Username atau password salah. Silakan coba lagi.</p>
    </div>

    <!-- Form -->
    <form id="loginForm" class="space-y-5" onsubmit="handleLogin(event)">

      <!-- Username -->
      <div>
        <label class="block text-sm font-semibold text-earth-700 mb-1.5">Username</label>
        <div class="relative">
          <span class="absolute left-3.5 top-1/2 -translate-y-1/2 text-earth-400">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                    d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/>
            </svg>
          </span>
          <input type="text" id="username" placeholder="Masukkan username"
                 class="input-field w-full pl-11 pr-4 py-3 rounded-xl border border-earth-200 bg-earth-50 text-earth-900 placeholder-earth-400 text-sm"
                 autocomplete="username">
        </div>
      </div>

      <!-- Password -->
      <div>
        <label class="block text-sm font-semibold text-earth-700 mb-1.5">Password</label>
        <div class="relative">
          <span class="absolute left-3.5 top-1/2 -translate-y-1/2 text-earth-400">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                    d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/>
            </svg>
          </span>
          <input type="password" id="password" placeholder="Masukkan password"
                 class="input-field w-full pl-11 pr-12 py-3 rounded-xl border border-earth-200 bg-earth-50 text-earth-900 placeholder-earth-400 text-sm"
                 autocomplete="current-password">
          <button type="button" id="togglePassword"
                  class="absolute right-3.5 top-1/2 -translate-y-1/2 text-earth-400 hover:text-earth-600 transition-colors"
                  onclick="togglePasswordVisibility()">
            <svg id="eyeIcon" class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                    d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/>
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                    d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/>
            </svg>
            <svg id="eyeOffIcon" class="w-5 h-5 hidden" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                    d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l3.59 3.59m0 0A9.953 9.953 0 0112 5c4.478 0 8.268 2.943 9.543 7a10.025 10.025 0 01-4.132 5.411m0 0L21 21"/>
            </svg>
          </button>
        </div>
      </div>

      <!-- Remember me -->
      <div class="flex items-center justify-between">
        <label class="flex items-center gap-2 cursor-pointer">
          <input type="checkbox" id="rememberMe"
                 class="w-4 h-4 rounded border-earth-300 text-primary-600 accent-primary-600">
          <span class="text-sm text-earth-600">Ingat saya</span>
        </label>
      </div>

      <!-- Login button -->
      <button type="submit" id="loginBtn"
              class="btn-login w-full py-3.5 rounded-xl text-white font-semibold text-sm shadow-lg shadow-primary-900/20">
        <span class="flex items-center justify-center gap-2">
          <svg id="loginIcon" class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                  d="M11 16l-4-4m0 0l4-4m-4 4h14m-5 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h7a3 3 0 013 3v1"/>
          </svg>
          <svg id="loginSpinner" class="w-5 h-5 animate-spin hidden" fill="none" viewBox="0 0 24 24">
            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"/>
            <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"/>
          </svg>
          <span id="loginBtnText">Masuk</span>
        </span>
      </button>
    </form>

    <!-- Demo credentials -->
    <div class="mt-5 p-4 rounded-xl border border-[#e8a838]/30 bg-amber-50">
      <div class="flex items-start gap-3">
        <div class="w-7 h-7 rounded-lg flex items-center justify-center shrink-0 mt-0.5"
             style="background:#e8a838;">
          <svg class="w-4 h-4 text-white" fill="currentColor" viewBox="0 0 20 20">
            <path fill-rule="evenodd" d="M18 10a8 8 0 11-16 0 8 8 0 0116 0zm-7-4a1 1 0 11-2 0 1 1 0 012 0zM9 9a1 1 0 000 2v3a1 1 0 001 1h1a1 1 0 100-2v-3a1 1 0 00-1-1H9z" clip-rule="evenodd"/>
          </svg>
        </div>
        <div>
          <p class="text-xs font-semibold text-amber-800 mb-1">Demo login: admin / desa2025</p>
          <p class="text-xs text-amber-700">
            Username: <code class="font-mono font-bold bg-amber-100 px-1.5 py-0.5 rounded text-amber-900">admin</code>
            &nbsp; Password: <code class="font-mono font-bold bg-amber-100 px-1.5 py-0.5 rounded text-amber-900">desa2025</code>
          </p>
        </div>
      </div>
    </div>

    <!-- Back to portal -->
    <div class="mt-6 text-center">
      <a href="index.html"
         class="inline-flex items-center gap-1.5 text-sm text-earth-500 hover:text-primary-700 transition-colors group">
        <svg class="w-4 h-4 group-hover:-translate-x-0.5 transition-transform" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"/>
        </svg>
        Kembali ke Portal Kalurahan
      </a>
    </div>
  </div>

  <!-- Footer -->
  <div class="fixed bottom-0 left-0 right-0 text-center py-3 z-10">
    <p class="text-xs text-white/50">© 2025 Kalurahan Bokoharjo · Prambanan, Sleman</p>
  </div>

<script>
  function togglePasswordVisibility() {
    const pwInput = document.getElementById('password');
    const eyeIcon = document.getElementById('eyeIcon');
    const eyeOffIcon = document.getElementById('eyeOffIcon');
    if (pwInput.type === 'password') {
      pwInput.type = 'text';
      eyeIcon.classList.add('hidden');
      eyeOffIcon.classList.remove('hidden');
    } else {
      pwInput.type = 'password';
      eyeIcon.classList.remove('hidden');
      eyeOffIcon.classList.add('hidden');
    }
  }

  function handleLogin(e) {
    e.preventDefault();
    const username = document.getElementById('username').value.trim();
    const password = document.getElementById('password').value;
    const loginBtn = document.getElementById('loginBtn');
    const loginIcon = document.getElementById('loginIcon');
    const loginSpinner = document.getElementById('loginSpinner');
    const loginBtnText = document.getElementById('loginBtnText');
    const errorMsg = document.getElementById('errorMsg');
    const loginCard = document.getElementById('loginCard');

    // Loading state
    loginBtn.disabled = true;
    loginIcon.classList.add('hidden');
    loginSpinner.classList.remove('hidden');
    loginBtnText.textContent = 'Memverifikasi...';
    errorMsg.classList.add('hidden');

    // Simulate network delay
    setTimeout(() => {
      if (username === 'admin' && password === 'desa2025') {
        loginBtnText.textContent = 'Berhasil! Mengalihkan...';
        loginBtn.style.background = 'linear-gradient(135deg,#15803d,#14532d)';
        setTimeout(() => {
          window.location.href = 'admin-dashboard.html';
        }, 700);
      } else {
        // Reset button
        loginBtn.disabled = false;
        loginIcon.classList.remove('hidden');
        loginSpinner.classList.add('hidden');
        loginBtnText.textContent = 'Masuk';

        // Show error
        errorMsg.classList.remove('hidden');

        // Shake animation
        loginCard.classList.remove('shake');
        void loginCard.offsetWidth; // reflow
        loginCard.classList.add('shake');

        // Highlight inputs
        ['username', 'password'].forEach(id => {
          const el = document.getElementById(id);
          el.classList.add('border-red-400', 'bg-red-50');
          el.classList.remove('border-earth-200', 'bg-earth-50');
          setTimeout(() => {
            el.classList.remove('border-red-400', 'bg-red-50');
            el.classList.add('border-earth-200', 'bg-earth-50');
          }, 2000);
        });
      }
    }, 900);
  }

  // Remove shake class after animation ends
  document.getElementById('loginCard').addEventListener('animationend', function(e) {
    if (e.animationName === 'shake') {
      this.classList.remove('shake');
    }
  });
</script>
</body>
</html>
